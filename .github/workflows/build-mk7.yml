name: Build Mario Kart 7 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Folder externals di repo kosong (submodule tidak ikut ter-upload),
      # jadi kita unduh sendiri dari daftar di .gitmodules.
      - name: Unduh externals
        run: |
          set -e
          [ -f .gitmodules ] || { echo ".gitmodules tidak ada"; exit 1; }
          # yang tidak dipakai build Android dilewati
          SKIP="catch discord-rpc libressl cpp-jwt"
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | sort -u | while read -r path; do
            name=$(basename "$path")
            case " $SKIP " in *" $name "*) echo "lewati $path"; continue;; esac
            url=$(git config -f .gitmodules --get "submodule.$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk -v p="$path" '$2==p{print $1; exit}' | sed 's/^submodule\.//; s/\.path$//').url")
            [ -n "$url" ] || { echo "url kosong untuk $path"; continue; }
            # hanya isi kalau folder kosong / belum ada file
            if [ -d "$path" ] && [ -n "$(ls -A "$path" 2>/dev/null)" ]; then echo "sudah ada $path"; continue; fi
            rm -rf "$path"; mkdir -p "$(dirname "$path")"
            case "$name" in
              fmt) git clone --depth 1 --branch 8.1.1 "$url" "$path" ;;
              *)   git clone --depth 1 --recurse-submodules --shallow-submodules "$url" "$path" ;;
            esac
          done
          echo "--- hasil externals ---"
          for d in dynarmic fmt boost teakra soundtouch libyuv enet nihstro cubeb xbyak cryptopp/cryptopp; do
            printf '%s: ' "$d"; ls "externals/$d" 2>/dev/null | wc -l
          done
          test -f externals/dynarmic/CMakeLists.txt
          test -f externals/fmt/CMakeLists.txt

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK, NDK, CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-31" "build-tools;34.0.0" \
            "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Build APK
        working-directory: src/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mario-kart-7-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
