name: Build Mario Kart 7 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Folder externals di repo kosong (submodule tidak ikut ter-upload).
      # Repo asli citra-emu/* sudah dihapus dari GitHub, jadi dialihkan ke mirror.
      - name: Unduh externals
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          [ -f .gitmodules ] || { echo ".gitmodules tidak ada"; exit 1; }
          SKIP="catch discord-rpc libressl cpp-jwt"
          : > /tmp/gagal.txt
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | sort -u -k2,2 | while read -r key path; do
            name=$(basename "$path")
            case " $SKIP " in *" $name "*) echo "lewati $path"; continue;; esac
            sec=${key#submodule.}; sec=${sec%.path}
            url=$(git config -f .gitmodules --get "submodule.$sec.url")
            # alihkan repo citra-emu yang sudah dihapus ke mirror
            case "$url" in
              *citra-emu/ext-boost*)      url="https://github.com/azahar-emu/ext-boost.git" ;;
              *citra-emu/ext-soundtouch*) url="https://codeberg.org/soundtouch/soundtouch.git" ;;
              *citra-emu/dynarmic*)       url="https://github.com/azahar-emu/dynarmic.git" ;;
            esac
            if [ -d "$path" ] && [ -n "$(ls -A "$path" 2>/dev/null)" ]; then echo "sudah ada $path"; continue; fi
            rm -rf "$path"; mkdir -p "$(dirname "$path")"
            echo ">>> $path <- $url"
            # versi lama yang cocok dengan kode Citra ini
            case "$name" in
              fmt)     ref="8.1.1" ;;
              cryptopp) ref="" ;;
              *)       ref="" ;;
            esac
            if [ "$name" = cryptopp ]; then
              # CMake Citra memakai nama file lama (crc-simd.cpp, pakai tanda hubung).
              # Mulai 8.2.0 namanya diganti crc_simd.cpp, jadi coba versi yang lebih lama.
              ok=0
              for r in CRYPTOPP_8_0_0 CRYPTOPP_7_0_0 CRYPTOPP_6_1_0; do
                rm -rf "$path"
                if git clone --depth 1 --branch "$r" "$url" "$path" 2>/dev/null && [ -f "$path/crc-simd.cpp" ]; then
                  echo "cryptopp dipakai: $r"; ok=1; break
                fi
              done
              [ "$ok" = 1 ] || echo "$path ($url) - tidak ada versi dengan crc-simd.cpp" >> /tmp/gagal.txt
            elif [ -n "$ref" ]; then
              git clone --depth 1 --branch "$ref" "$url" "$path" || echo "$path ($url)" >> /tmp/gagal.txt
            else
              git clone --depth 1 --recurse-submodules --shallow-submodules "$url" "$path" || echo "$path ($url)" >> /tmp/gagal.txt
            fi
          done
          echo "--- jumlah file per folder ---"
          for d in dynarmic fmt boost teakra soundtouch libyuv enet nihstro cubeb xbyak cryptopp/cryptopp; do
            printf '%s: ' "$d"; ls "externals/$d" 2>/dev/null | wc -l
          done
          if [ -s /tmp/gagal.txt ]; then echo "=== GAGAL DIUNDUH ==="; cat /tmp/gagal.txt; exit 1; fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK, NDK, CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-31" "build-tools;34.0.0" \
            "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Build APK
        working-directory: src/android
        # CI=true membuat CMake Citra membaca nama repo Travis/AppVeyor lalu error
        run: env -u CI gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mario-kart-7-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
